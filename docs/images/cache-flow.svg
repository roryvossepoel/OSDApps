<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">OSDStage cold and warm cache flow</title><desc id="desc">A cold cache is populated from repository and vendor sources; later deployments reuse and refresh the persistent USB cache.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.sh{font-size:21px;font-weight:700}.t{font-size:16px;font-weight:600}.s{font-size:14px}.box{fill:#fff;stroke:#9fb1c8;stroke-width:2}.cold{fill:#f4f7fb;stroke:#6b83a3;stroke-width:2}.warm{fill:#eef7f2;stroke:#6a9a7d;stroke-width:2}.arrow{stroke:#4a5a73;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a5a73"/></marker></defs>
<text x="600" y="42" text-anchor="middle" class="h">Persistent cache: first deployment vs following deployments</text>
<text x="300" y="92" text-anchor="middle" class="sh">Cold cache</text><text x="900" y="92" text-anchor="middle" class="sh">Warm cache</text>
<rect x="105" y="125" width="390" height="95" rx="12" class="cold"/><text x="300" y="158" text-anchor="middle" class="t">Acquire current content</text><text x="300" y="187" text-anchor="middle" class="s">Repository packages in WinPE</text><text x="300" y="209" text-anchor="middle" class="s">Built-in vendor payloads in full Windows</text>
<rect x="105" y="270" width="390" height="95" rx="12" class="box"/><text x="300" y="303" text-anchor="middle" class="t">Populate OSDCloud USB cache</text><text x="300" y="332" text-anchor="middle" class="s">Persistent content survives deployment</text><text x="300" y="354" text-anchor="middle" class="s">and becomes the fallback for later runs</text>
<rect x="705" y="125" width="390" height="95" rx="12" class="warm"/><text x="900" y="158" text-anchor="middle" class="t">Reuse existing cache</text><text x="900" y="187" text-anchor="middle" class="s">Validate current content</text><text x="900" y="209" text-anchor="middle" class="s">Refresh only when necessary</text>
<rect x="705" y="270" width="390" height="95" rx="12" class="box"/><text x="900" y="303" text-anchor="middle" class="t">Stage locally and install</text><text x="900" y="332" text-anchor="middle" class="s">OS drive always receives local payload</text><text x="900" y="354" text-anchor="middle" class="s">before the Runner installs Apps[]</text>
<path d="M300 220 V270" class="arrow"/><path d="M900 220 V270" class="arrow"/><path d="M495 317 H705" class="arrow"/>
<rect x="300" y="430" width="600" height="95" rx="12" class="warm"/><text x="600" y="463" text-anchor="middle" class="t">Same deployment commands</text><text x="600" y="492" text-anchor="middle" class="s">Cache changes performance and offline resilience, not the Add-* workflow</text><text x="600" y="515" text-anchor="middle" class="s">Cold/warm timing values can be documented from measured deployment runs</text>
</svg>