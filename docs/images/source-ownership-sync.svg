<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">OSDStage source ownership and sync moments</title>
<desc id="desc">Repository apps and scripts are organization-maintained and synchronized in WinPE. Built-in apps are vendor-maintained and refreshed in full Windows. Repository packages can contain apps or scripts. Both sources execute from local staging. Full Windows can also prepare repository caches ahead of deployment.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:28px;font-weight:700}.sh{font-size:21px;font-weight:700}.t{font-size:17px;font-weight:600}.s{font-size:15px}.label{font-size:13px;font-weight:700;fill:#fff}.box{fill:#fff;stroke:#9fb1c8;stroke-width:2}.repo{fill:#f4f7fb;stroke:#6b83a3;stroke-width:2}.built{fill:#eef7f2;stroke:#6a9a7d;stroke-width:2}.phase{fill:#233b5f}.arrow{stroke:#4a5a73;stroke-width:3;fill:none;marker-end:url(#a)}</style>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a5a73"/></marker></defs>
<rect width="1200" height="690" rx="16" fill="#f6f8fb"/>
<text x="600" y="42" text-anchor="middle" class="h">Source ownership and sync moments</text>
<text x="300" y="88" text-anchor="middle" class="sh">Repository apps and scripts</text><text x="900" y="88" text-anchor="middle" class="sh">Built-in apps</text>
<rect x="110" y="120" width="380" height="105" rx="12" class="repo"/><text x="300" y="154" text-anchor="middle" class="t">Organization-maintained</text><text x="300" y="184" text-anchor="middle" class="s">You own versions, packages, Install.ps1</text><text x="300" y="208" text-anchor="middle" class="s">and the repository hosting lifecycle</text>
<rect x="710" y="120" width="380" height="105" rx="12" class="built"/><text x="900" y="154" text-anchor="middle" class="t">Vendor-maintained source</text><text x="900" y="184" text-anchor="middle" class="s">OSDStage knows how to acquire</text><text x="900" y="208" text-anchor="middle" class="s">the current vendor-hosted installer</text>
<rect x="130" y="270" width="340" height="48" rx="9" class="phase"/><text x="300" y="300" text-anchor="middle" class="label">PREPARE ON WINDOWS · STAGE IN WINPE</text>
<rect x="730" y="270" width="340" height="48" rx="9" class="phase"/><text x="900" y="300" text-anchor="middle" class="label">SYNC / UPDATE MOMENT · FULL WINDOWS</text>
<rect x="110" y="350" width="380" height="135" rx="12" class="box"/><text x="300" y="382" text-anchor="middle" class="t">Repository sync</text><text x="300" y="412" text-anchor="middle" class="s">Check catalog + manifest</text><text x="300" y="437" text-anchor="middle" class="s">Download or reuse Package.zip</text><text x="300" y="462" text-anchor="middle" class="s">Stage current package to OS drive</text>
<rect x="710" y="350" width="380" height="135" rx="12" class="box"/><text x="900" y="382" text-anchor="middle" class="t">Built-in refresh</text><text x="900" y="412" text-anchor="middle" class="s">Check vendor freshness</text><text x="900" y="437" text-anchor="middle" class="s">Validate and replace complete cache</text><text x="900" y="462" text-anchor="middle" class="s">Stage current payload to OS drive</text>
<path d="M300 225 V270" class="arrow"/><path d="M900 225 V270" class="arrow"/><path d="M300 318 V350" class="arrow"/><path d="M900 318 V350" class="arrow"/>
<rect x="360" y="540" width="480" height="100" rx="12" class="repo"/><text x="600" y="574" text-anchor="middle" class="t">One local installation queue</text><text x="600" y="604" text-anchor="middle" class="s">Runner executes staged apps and scripts in order</text><text x="600" y="628" text-anchor="middle" class="s">No repository re-sync during SetupComplete</text>
<path d="M300 485 C300 535 430 560 455 560" class="arrow"/><path d="M900 485 C900 535 770 560 745 560" class="arrow"/>
</svg>
