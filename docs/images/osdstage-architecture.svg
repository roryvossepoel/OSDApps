<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Stage in WinPE. Ready before OOBE.</title>
  <desc id="desc">After OSDCloud applies Windows, stage built-in app configuration and repository app or script packages in WinPE. An optional USB flash drive cache reuses validated content. On first Windows boot, SetupComplete runs PreInstall to prepare built-ins and the runner to execute the ordered queue as SYSTEM. Results remain available when Windows continues to OOBE. There is no automatic retry after reboot.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#425c75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #172b42; }
    .brand { font-size: 18px; font-weight: 700; fill: #203e60; letter-spacing: 2px; }
    .headline { font-size: 42px; font-weight: 700; }
    .heading { font-size: 25px; font-weight: 700; }
    .label { font-size: 22px; font-weight: 600; }
    .body { font-size: 21px; fill: #425c75; }
    .small { font-size: 18px; fill: #425c75; }
    .icon { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #425c75; stroke-width: 2.5; marker-end: url(#arrow); }
    .white { fill: #fff; }
  </style>
  <rect x="1" y="1" width="1198" height="998" rx="20" fill="#f6f8fb" stroke="#cad6e3"/>
  <rect x="56" y="44" width="5" height="22" rx="2.5" fill="#8db69d"/>
  <text x="76" y="62" class="brand">OSDStage / HOW IT WORKS</text>
  <text x="56" y="119" class="headline">Stage in WinPE. Ready before OOBE.</text>
  <text x="58" y="157" class="body">Built-in apps and your repository. One ordered deployment.</text>

  <rect x="56" y="194" width="1088" height="296" rx="16" fill="#fff" stroke="#cad6e3"/>
  <rect x="80" y="216" width="40" height="40" rx="12" fill="#203e60"/>
  <text x="100" y="244" text-anchor="middle" class="label white">1</text>
  <text x="136" y="244" class="heading">Stage in WinPE</text>
  <text x="1118" y="243" text-anchor="end" class="small">After OSDCloud applies Windows</text>

  <rect x="80" y="278" width="328" height="122" rx="12" fill="#eaf5ee" stroke="#8db69d"/>
  <g class="icon" stroke="#426c53" transform="translate(100 299)"><rect width="38" height="32" rx="5"/><path d="M0 10 H38 M11 22 L17 27 L28 17"/></g>
  <text x="151" y="323" class="label">Built-in apps</text>
  <text x="100" y="360" class="small">Stage vendor app configuration.</text>
  <text x="100" y="385" class="small">Prepare content at first boot.</text>

  <rect x="436" y="278" width="328" height="122" rx="12" fill="#eef2fa" stroke="#9caed0"/>
  <g class="icon" stroke="#203e60" transform="translate(456 299)"><rect width="38" height="32" rx="5"/><path d="M9 9 L17 16 L9 23 M23 23 H30"/></g>
  <text x="507" y="323" class="label">Your repository</text>
  <text x="456" y="360" class="small">Stage selected apps and scripts.</text>
  <text x="456" y="385" class="small">Validate package SHA-256.</text>

  <rect x="792" y="278" width="328" height="122" rx="12" fill="#fff6e6" stroke="#cfb57f"/>
  <g class="icon" stroke="#856a36" transform="translate(816 296)"><path d="M6 12 V0 H24 V12 M12 4 V7 M18 4 V7"/><rect y="12" width="30" height="25" rx="6"/></g>
  <text x="859" y="323" class="label">Optional cache</text>
  <text x="812" y="360" class="small">Reuse a USB flash drive cache.</text>
  <text x="812" y="385" class="small">Keep connected until OOBE.</text>

  <path d="M244 400 V421 H600 M956 400 V421 H600 M600 400 V437" class="arrow"/>
  <rect x="230" y="438" width="740" height="34" rx="8" fill="#e5edf7"/>
  <text x="600" y="461" text-anchor="middle" font-size="18" font-weight="600">One ordered queue · local staging · standalone runtime</text>

  <path d="M600 490 V525" class="arrow"/>
  <rect x="56" y="538" width="1088" height="258" rx="16" fill="#fff" stroke="#cad6e3"/>
  <rect x="80" y="560" width="40" height="40" rx="12" fill="#203e60"/>
  <text x="100" y="588" text-anchor="middle" class="label white">2</text>
  <text x="136" y="588" class="heading">Run at first Windows boot</text>
  <text x="1118" y="587" text-anchor="end" class="small">SetupComplete · one execution</text>

  <rect x="80" y="622" width="480" height="150" rx="12" fill="#eaf5ee" stroke="#8db69d"/>
  <text x="104" y="660" class="label">PreInstall / prepare built-ins</text>
  <text x="104" y="695" class="small">Refresh vendor content or use a valid cache.</text>
  <text x="104" y="723" class="small">Validate replacements before switching the cache.</text>
  <text x="104" y="751" class="small">Prepare local payloads for the runner.</text>

  <path d="M572 697 H628" class="arrow"/>
  <rect x="640" y="622" width="480" height="150" rx="12" fill="#eef2fa" stroke="#9caed0"/>
  <text x="664" y="660" class="label">Runner / execute the queue</text>
  <text x="664" y="695" class="small">Install apps and run scripts as SYSTEM.</text>
  <text x="664" y="723" class="small">Follow the queue and record each outcome.</text>
  <text x="664" y="751" class="small">No automatic retry after reboot.</text>

  <path d="M600 796 V831" class="arrow"/>
  <rect x="56" y="844" width="1088" height="116" rx="16" fill="#203e60"/>
  <rect x="80" y="864" width="40" height="40" rx="12" fill="#fff"/>
  <text x="100" y="892" text-anchor="middle" class="label">3</text>
  <text x="136" y="892" class="heading white">Continue to OOBE. Keep the results.</text>
  <text x="136" y="922" class="small" style="fill:#fff">Clean staging on success; retain it on failure. Persistent results and logs remain available.</text>
  <text x="136" y="947" class="small" style="fill:#dce7f3">Reaching OOBE alone does not prove success: check the recorded package outcomes.</text>
</svg>
