<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">OSDStage — Your apps. Ready before OOBE.</title>
  <desc id="desc">Stage in WinPE. Install apps and run scripts before OOBE starts. Built-in vendor apps and apps or scripts from your own repository, with an optional USB flash drive cache.</desc>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .brand { font-size: 28px; font-weight: 700; fill: #203e60; }
    .headline { font-size: 54px; font-weight: 700; fill: #172b42; }
    .accent { fill: #203e60; }
    .body { font-size: 23px; fill: #425c75; }
    .label { font-size: 17px; font-weight: 600; fill: #172b42; }
    .small { font-size: 15px; fill: #425c75; }
    .icon { fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-width: 3; }
  </style>

  <rect x="1" y="1" width="1198" height="398" rx="20" fill="#f6f8fb" stroke="#cad6e3"/>
  <rect x="56" y="54" width="5" height="28" rx="2.5" fill="#8db69d"/>
  <text x="76" y="78" class="brand">OSDStage</text>

  <text x="56" y="159" class="headline">Your apps.</text>
  <text x="56" y="222" class="headline accent">Ready before OOBE.</text>
  <text x="58" y="286" class="body">Stage in WinPE.</text>
  <text x="58" y="320" class="body">Install apps and run scripts before OOBE starts.</text>

  <!-- Simple capability icons, not a deployment flow or app screenshot. -->
  <g transform="translate(760 66)">
    <rect width="384" height="268" rx="18" fill="#e5edf7"/>

    <rect x="20" y="20" width="164" height="132" rx="12" fill="#eaf5ee" stroke="#8db69d"/>
    <g class="icon" stroke="#426c53" transform="translate(75 36)">
      <rect width="54" height="46" rx="7"/>
      <path d="M0 14 H54"/>
      <path d="M10 7 H11 M18 7 H19"/>
      <path d="M18 30 L25 37 L38 24"/>
    </g>
    <text x="102" y="113" text-anchor="middle" class="label">Built-in apps</text>
    <text x="102" y="136" text-anchor="middle" class="small">Vendor downloads</text>

    <rect x="200" y="20" width="164" height="132" rx="12" fill="#eef2fa" stroke="#9caed0"/>
    <g class="icon" stroke="#203e60" transform="translate(255 36)">
      <rect width="54" height="46" rx="7"/>
      <path d="M13 14 L24 23 L13 32 M30 32 H41"/>
    </g>
    <text x="282" y="113" text-anchor="middle" class="label">Your repository</text>
    <text x="282" y="136" text-anchor="middle" class="small">Apps &amp; scripts</text>

    <rect x="20" y="170" width="344" height="78" rx="12" fill="#fff6e6" stroke="#cfb57f"/>
    <g class="icon" stroke="#856a36" transform="translate(40 187)">
      <path d="M10 15 V2 H32 V15"/>
      <path d="M17 6 V10 M25 6 V10"/>
      <rect x="5" y="15" width="32" height="30" rx="7"/>
      <path d="M17 36 H25"/>
    </g>
    <text x="96" y="202" class="label">Optional cache</text>
    <text x="96" y="226" class="small">USB flash drive</text>
  </g>
</svg>
