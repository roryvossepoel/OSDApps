<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">OSDApps 0.29.1 cold versus warm cache benchmark</title>
  <desc id="desc">Stacked bars comparing PreInstall refresh and Runner installation time for cold and warm cache deployments.</desc>
  <style>
    .title{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#1f2937}
    .subtitle{font:400 16px 'Segoe UI',Arial,sans-serif;fill:#4b5563}
    .axis{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#374151}
    .label{font:600 17px 'Segoe UI',Arial,sans-serif;fill:#111827}
    .small{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#4b5563}
    .value{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#111827}
    .legend{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#374151}
    .grid{stroke:#e5e7eb;stroke-width:1}
    .pre{fill:#3b82f6}
    .run{fill:#94a3b8}
    .card{fill:#f8fafc;stroke:#e2e8f0;stroke-width:1}
    .good{fill:#166534}
  </style>

  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="60" y="55" class="title">OSDApps 0.29.1 — cold vs warm cache</text>
  <text x="60" y="84" class="subtitle">Same USB flash drive, same hardware, same app set</text>

  <rect x="760" y="34" width="280" height="82" rx="12" class="card"/>
  <text x="785" y="66" class="small">Warm-cache improvement</text>
  <text x="785" y="96" class="value good">87.9 s faster · ~19%</text>

  <line x1="120" y1="510" x2="710" y2="510" class="grid"/>
  <line x1="120" y1="422" x2="710" y2="422" class="grid"/>
  <line x1="120" y1="334" x2="710" y2="334" class="grid"/>
  <line x1="120" y1="246" x2="710" y2="246" class="grid"/>
  <line x1="120" y1="158" x2="710" y2="158" class="grid"/>

  <text x="72" y="516" class="axis">0 s</text>
  <text x="55" y="428" class="axis">100 s</text>
  <text x="55" y="340" class="axis">200 s</text>
  <text x="55" y="252" class="axis">300 s</text>
  <text x="55" y="164" class="axis">400 s</text>

  <!-- scale: 0.88 px per second, baseline 510 -->
  <!-- cold runner 330.7 = 291.0 px; pre 125.2 = 110.2 px -->
  <rect x="205" y="108.8" width="170" height="110.2" rx="6" class="pre"/>
  <rect x="205" y="219.0" width="170" height="291.0" rx="6" class="run"/>
  <text x="290" y="92" text-anchor="middle" class="value">455.9 s</text>
  <text x="290" y="574" text-anchor="middle" class="label">Cold cache</text>
  <text x="290" y="603" text-anchor="middle" class="small">7 min 36 s</text>

  <!-- warm runner 327.4 = 288.1 px; pre 40.6 = 35.7 px -->
  <rect x="455" y="186.2" width="170" height="35.7" rx="6" class="pre"/>
  <rect x="455" y="221.9" width="170" height="288.1" rx="6" class="run"/>
  <text x="540" y="169" text-anchor="middle" class="value">368.0 s</text>
  <text x="540" y="574" text-anchor="middle" class="label">Warm cache</text>
  <text x="540" y="603" text-anchor="middle" class="small">6 min 08 s</text>

  <rect x="775" y="170" width="18" height="18" rx="3" class="pre"/>
  <text x="805" y="184" class="legend">PreInstall / refresh</text>
  <rect x="775" y="205" width="18" height="18" rx="3" class="run"/>
  <text x="805" y="219" class="legend">Runner / installations</text>

  <rect x="760" y="260" width="280" height="190" rx="12" class="card"/>
  <text x="785" y="292" class="label">What changed?</text>
  <text x="785" y="327" class="small">PreInstall</text>
  <text x="1000" y="327" text-anchor="end" class="value">125.2 → 40.6 s</text>
  <text x="785" y="365" class="small">Runner</text>
  <text x="1000" y="365" text-anchor="end" class="value">330.7 → 327.4 s</text>
  <text x="785" y="403" class="small">Main result</text>
  <text x="785" y="430" class="small">Cache savings occur almost entirely</text>
  <text x="785" y="452" class="small">before installation starts.</text>

  <text x="760" y="515" class="small">Validated app set:</text>
  <text x="760" y="541" class="small">Microsoft 365 Apps · Teams · Chrome</text>
  <text x="760" y="563" class="small">Horizon Client · Notepad++ · Adobe Acrobat</text>
</svg>