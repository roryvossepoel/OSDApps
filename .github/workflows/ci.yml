name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    name: Validate PowerShell 7
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'Expected PowerShell 7.' }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
      - name: Validate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./OSDApps.psd1 -ErrorAction Stop | Format-List Name,Version,Author
      - name: Full analyzer and Pester suite with package build
        shell: pwsh
        run: |
          ./build/Test-Module.ps1 -ResultsPath ./TestResults
      - name: Exercise native sleep request and process cleanup
        shell: pwsh
        run: ./tools/Test-OSDAppsSleepPrevention.ps1 -HoldSeconds 1
      - name: Verify packaged Get-Help
        shell: pwsh
        run: |
          ./build/Test-PackagedHelp.ps1 -ModulePath ./dist/OSDApps
      - name: Validate example repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Get-Content ./Examples/Repository/catalog.json -Raw | ConvertFrom-Json
          if ($catalog.SchemaVersion -ne 1) { throw 'Unexpected example catalog schema.' }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-PowerShell-7
          path: TestResults
          if-no-files-found: warn
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSDApps-PowerShell-7
          path: dist/OSDApps
          if-no-files-found: error

  validate_windows_powershell:
    name: Validate Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install test dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1.' }
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
      - name: Validate manifest and metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./OSDApps.psd1 -ErrorAction Stop | Format-List Name,Version,Author
          Import-Module ./OSDApps.psd1 -Force
          $module = Get-Module OSDApps
          & $module {
              $definitions = @(Get-OSDAppUIBuiltInMetadata)
              $expected = @{
                  Microsoft365Apps='Microsoft'; MicrosoftTeams='Microsoft'; MicrosoftCompanyPortal='Microsoft'; CMTraceOpen='CMTrace Open'
                  WindowsInboxCleanup='OSDApps'; WindowsFeatures='OSDApps'; WiFiProfiles='OSDApps'
                  AdobeAcrobatUnified='Adobe'; GoogleChromeEnterprise='Google'
                  MozillaFirefoxEnterprise='Mozilla'; CiscoWebex='Cisco'; ZoomWorkplace='Zoom'; '7Zip'='Igor Pavlov'; VisualStudioCode='Microsoft'; VisualCRedist='Microsoft'; DotNetRuntime='Microsoft'
              }
              if ($definitions.Count -ne $expected.Count) { throw 'Built-in metadata count mismatch.' }
              foreach ($id in $expected.Keys) {
                  $info = Get-OSDAppUIDisplayInfo -App ([pscustomobject]@{Id=$id;Source='BuiltIn'}) -BuiltInMetadata $definitions
                  if ($info.Vendor -ne $expected[$id] -or -not $info.DisplayName -or ($info.DisplayName -eq $id -and $id -ne '7Zip')) { throw "Incorrect metadata: $id" }
              }
              Write-Host 'Windows PowerShell 5.1 built-in metadata smoke checks passed.'
          }
      - name: Full analyzer and Pester suite with package build
        shell: powershell
        run: |
          ./build/Test-Module.ps1 -ResultsPath ./TestResults
      - name: Exercise native sleep request and process cleanup
        shell: powershell
        run: ./tools/Test-OSDAppsSleepPrevention.ps1 -HoldSeconds 1
      - name: Verify packaged Get-Help
        shell: powershell
        run: |
          ./build/Test-PackagedHelp.ps1 -ModulePath ./dist/OSDApps
      - name: Validate example repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Get-Content ./Examples/Repository/catalog.json -Raw | ConvertFrom-Json
          if ($catalog.SchemaVersion -ne 1) { throw 'Unexpected example catalog schema.' }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-Windows-PowerShell-5.1
          path: TestResults
          if-no-files-found: warn
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSDApps-Windows-PowerShell-5.1
          path: dist/OSDApps
          if-no-files-found: error
