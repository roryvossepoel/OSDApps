name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate module
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install test dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest -Path ./OSDApps.psd1 -ErrorAction Stop | Format-List Name,Version,Author,Description

      - name: WinPE-compatible UI metadata smoke test (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) {
              throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)."
          }
          Import-Module ./OSDApps.psd1 -Force -ErrorAction Stop
          $module = Get-Module OSDApps -ErrorAction Stop
          & $module {
              $definitions = @(Get-OSDAppUIBuiltInMetadata -ErrorAction Stop)
              if ($definitions.Count -ne 6) {
                  throw "Expected 6 built-in metadata entries; got $($definitions.Count)."
              }
              $expected = @{
                  Microsoft365Apps='Microsoft'
                  MicrosoftTeams='Microsoft'
                  AdobeAcrobatUnified='Adobe'
                  GoogleChromeEnterprise='Google'
                  MozillaFirefoxEnterprise='Mozilla'
                  CiscoWebex='Cisco'
              }
              foreach ($key in $expected.Keys) {
                  $app = [pscustomobject]@{ Id=$key; Source='BuiltIn' }
                  $resolved = Get-OSDAppUIDisplayInfo -Application $app -BuiltInMetadata $definitions
                  if ($resolved.Vendor -ne $expected[$key] -or
                      -not $resolved.DisplayName -or $resolved.DisplayName -eq $key) {
                      throw "PowerShell 5.1 Vendor/display resolution failed for $key : $($resolved | Out-String)"
                  }
              }
              $repoApp = [pscustomobject]@{ Id='ExampleRepoApp'; Source='Repository' }
              $repo = Get-OSDAppUIDisplayInfo -Application $repoApp -BuiltInMetadata $definitions
              if ($repo.Vendor -ne '-' -or $repo.DisplayName -ne 'ExampleRepoApp') {
                  throw 'Repository app was incorrectly assigned a vendor.'
              }
              Write-Host "Windows PowerShell $($PSVersionTable.PSVersion): 6/6 built-in Vendors resolved."

              # Trust policy must also work under the Windows PowerShell
              # version used by SetupComplete and WinPE.
              $publishers = @(
                  @{ Id='MicrosoftTeams'; Subject='CN=Microsoft Corporation, O=Microsoft Corporation, C=US' },
                  @{ Id='CiscoWebex'; Subject='CN="Cisco Systems, Inc.", O="Cisco Systems, Inc.", C=US' },
                  @{ Id='GoogleChromeEnterprise'; Subject='CN=Google LLC, O=Google LLC, C=US' },
                  @{ Id='MozillaFirefoxEnterprise'; Subject='CN=Mozilla Corporation, O=Mozilla Corporation, C=US' }
              )
              foreach ($publisher in $publishers) {
                  if (-not (Test-OSDAppExpectedPublisher -Id $publisher.Id -SignerSubject $publisher.Subject)) {
                      throw "Windows PowerShell 5.1 signer policy failed for $($publisher.Id)."
                  }
                  if (Test-OSDAppExpectedPublisher -Id $publisher.Id -SignerSubject 'CN=Other, O=Other Vendor LLC, C=US') {
                      throw "Windows PowerShell 5.1 accepted an unrelated signer for $($publisher.Id)."
                  }
              }
              Write-Host 'Windows PowerShell 5.1: expected publisher policy checks passed.'
          }

      - name: Run analyzer and Pester
        shell: pwsh
        run: |
          ./build/Test-Module.ps1

      - name: Validate example repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./OSDApps.psd1 -Force
          $catalog = Get-Content ./Examples/Repository/catalog.json -Raw | ConvertFrom-Json
          if ($catalog.SchemaVersion -ne 1) {
              throw 'Examples/Repository/catalog.json has an unexpected SchemaVersion.'
          }

      - name: Build distributable module
        shell: pwsh
        run: |
          ./build/Build-Module.ps1 -OutputPath ./dist | Format-List

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSDApps
          path: dist/OSDApps
          if-no-files-found: error