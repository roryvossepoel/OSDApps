name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  changes:
    name: Classify changes and validate icons
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_module: ${{ steps.classify.outputs.run_module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Test change selection
        run: python3 -m unittest discover -s build -p test_ci_changes.py -v
      - name: Classify changes and validate SVG files
        id: classify
        run: python3 build/ci_changes.py

  validate:
    name: Validate PowerShell 7
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run_module != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require successful change and icon checks
        if: ${{ needs.changes.result != 'success' }}
        shell: pwsh
        run: throw 'Change classification or SVG validation failed. See the changes job.'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 7) { throw 'Expected PowerShell 7.' }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default -ErrorAction Stop }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
      - name: Validate manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./OSDStage.psd1 -ErrorAction Stop | Format-List Name,Version,Author
      - name: Full analyzer and Pester suite with package build
        shell: pwsh
        run: |
          ./build/Test-Module.ps1 -ResultsPath ./TestResults
      - name: Exercise native sleep request and process cleanup
        shell: pwsh
        run: ./tools/Test-OSDStageSleepPrevention.ps1 -HoldSeconds 1
      - name: Verify packaged Get-Help
        shell: pwsh
        run: |
          ./build/Test-PackagedHelp.ps1 -ModulePath ./dist/OSDStage
      - name: Validate example repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Get-Content ./Examples/Repository/catalog.json -Raw | ConvertFrom-Json
          if ($catalog.SchemaVersion -ne 2) { throw 'Unexpected example catalog schema.' }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-PowerShell-7
          path: TestResults
          if-no-files-found: warn
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSDStage-PowerShell-7
          path: dist/OSDStage
          if-no-files-found: error

  validate_windows_powershell:
    name: Validate Windows PowerShell 5.1
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.run_module != 'false') }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require successful change and icon checks
        if: ${{ needs.changes.result != 'success' }}
        shell: pwsh
        run: throw 'Change classification or SVG validation failed. See the changes job.'
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install test dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1.' }
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          if (-not (Get-PackageProvider -Name NuGet -ListAvailable -ErrorAction SilentlyContinue)) {
              Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default -ErrorAction Stop }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
      - name: Validate manifest and metadata
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Test-ModuleManifest ./OSDStage.psd1 -ErrorAction Stop | Format-List Name,Version,Author
          Import-Module ./OSDStage.psd1 -Force
          $module = Get-Module OSDStage
          & $module {
              $definitions = @(Get-OSDStageUIBuiltInMetadata)
              $expected = @{
                  Microsoft365Apps='Microsoft'; MicrosoftTeams='Microsoft'; MicrosoftCompanyPortal='Microsoft'; CMTraceOpen='CMTrace Open'
                  WindowsInboxCleanup='OSDStage'; WindowsFeatures='OSDStage'; WindowsCapabilities='OSDStage'; WindowsUpdate='OSDStage'; DefaultAssociations='OSDStage'; EnvironmentVariables='OSDStage'; FileSystem='OSDStage'; Services='OSDStage'; DesktopSettings='OSDStage'; WiFiProfiles='OSDStage'; Certificates='OSDStage'
                  AdobeAcrobatUnified='Adobe'; GoogleChromeEnterprise='Google'
                  MozillaFirefoxEnterprise='Mozilla'; CiscoWebex='Cisco'; ZoomWorkplace='Zoom'; '7Zip'='Igor Pavlov'; VisualStudioCode='Microsoft'; VisualCRedist='Microsoft'; DotNetRuntime='Microsoft'
              }
              if ($definitions.Count -ne $expected.Count) { throw 'Built-in metadata count mismatch.' }
              foreach ($id in $expected.Keys) {
                  $info = Get-OSDStageUIDisplayInfo -App ([pscustomobject]@{Id=$id;Source='BuiltIn'}) -BuiltInMetadata $definitions
                  if ($info.Vendor -ne $expected[$id] -or -not $info.DisplayName -or ($info.DisplayName -eq $id -and $id -ne '7Zip')) { throw "Incorrect metadata: $id" }
              }
              Write-Host 'Windows PowerShell 5.1 built-in metadata smoke checks passed.'
          }
      - name: Full analyzer and Pester suite with package build
        shell: powershell
        run: |
          ./build/Test-Module.ps1 -ResultsPath ./TestResults
      - name: Exercise native sleep request and process cleanup
        shell: powershell
        run: ./tools/Test-OSDStageSleepPrevention.ps1 -HoldSeconds 1
      - name: Verify packaged Get-Help
        shell: powershell
        run: |
          ./build/Test-PackagedHelp.ps1 -ModulePath ./dist/OSDStage
      - name: Validate example repository
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Get-Content ./Examples/Repository/catalog.json -Raw | ConvertFrom-Json
          if ($catalog.SchemaVersion -ne 2) { throw 'Unexpected example catalog schema.' }
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-Windows-PowerShell-5.1
          path: TestResults
          if-no-files-found: warn
      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSDStage-Windows-PowerShell-5.1
          path: dist/OSDStage
          if-no-files-found: error
