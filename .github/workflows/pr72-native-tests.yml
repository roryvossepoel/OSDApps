name: PR72 full native payload validation
on:
  push:
    branches: [feature/native-vendor-filenames-app-type]
    paths: [.github/workflows/pr72-native-tests.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'roryvossepoel/OSDApps' && github.ref == 'refs/heads/feature/native-vendor-filenames-app-type'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply exact-preimage test and reporting patch
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request, zlib
          def api(path):
              request = urllib.request.Request('https://api.github.com/repos/roryvossepoel/OSDApps' + path, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'OSDApps-PR72-Tests'})
              with urllib.request.urlopen(request, timeout=60) as response: return json.load(response)
          ids = ['a197c8c9260624ba4adfe4d93a3e538d869831c8','516ba4460abf7f8d26843e8c9e7d697a2f2c550e','09effb7af2140737a8bfb9964b98bee6a4f5584b']
          chunks = [base64.b64decode(api('/git/blobs/' + sha)['content']) for sha in ids]
          # Repair one identified base64 transport insertion, then verify both the chunk and complete patch.
          encoded = base64.b64encode(chunks[0]).decode('ascii')
          assert encoded.count('7DSKp/eM') == 1
          chunks[0] = base64.b64decode(encoded.replace('7DSKp/eM', '7DSK/eM') + 'e')
          assert hashlib.sha1(b'blob ' + str(len(chunks[0])).encode() + b'\0' + chunks[0]).hexdigest() == 'a79fc013dad09b8cb43860a562e6ae415fde00c4'
          patch = zlib.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest() == '3ed91c94f8669929e2660298a61f8b44385592e4596af56cecb0a7dd1819fd58'
          targets = []; current = None
          for line in patch.decode('utf-8').splitlines():
              if line.startswith('diff --git '):
                  match = re.fullmatch(r'diff --git a/(.+) b/(.+)', line)
                  assert match and match[1] == match[2]
                  current = match[1]
                  assert re.fullmatch(r'Tests/(?:Helpers/)?[A-Za-z0-9.-]+[.]ps1|Runtime/Invoke-OSDAppPreInstall[.]ps1', current), current
                  targets.append(current)
              elif line.startswith('index '):
                  old = line.split()[1].split('..')[0]
                  if old == '0' * 40: assert not pathlib.Path(current).exists(), current
                  else: assert subprocess.check_output(['git','rev-parse','HEAD:' + current], text=True).strip() == old, current
          assert len(targets) == len(set(targets)) == 21
          subprocess.run(['git','config','core.autocrlf','false'], check=True)
          subprocess.run(['git','checkout-index','--all','--force'], check=True)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pr72-tests.patch'; path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)], check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)], check=True)
          subprocess.run(['git','diff','--check'], check=True)
          pathlib.Path(os.environ['RUNNER_TEMP'], 'pr72-targets.json').write_text(json.dumps(targets), encoding='utf-8')
      - name: Validate source and tests on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          foreach ($folder in @('Public','Private','Runtime','Tests')) {
            foreach ($file in Get-ChildItem $folder -Filter '*.ps1' -Recurse -File) {
              $tokens = $null; $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
              foreach ($errorItem in @($errors)) { $failures += "$($file.Name):$($errorItem.Extent.StartLineNumber): $($errorItem.Message)" }
            }
          }
          if ($failures.Count) { throw ($failures -join "`n") }
          Import-Module .\OSDApps.psd1 -Force -ErrorAction Stop
      - name: Prepare parsed commit without updating branch refs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, pathlib, urllib.request
          def api(path, data=None):
              request = urllib.request.Request('https://api.github.com/repos/roryvossepoel/OSDApps' + path, data=None if data is None else json.dumps(data).encode('utf-8'), headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'OSDApps-PR72-Tests'}, method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=90) as response: return json.load(response)
          parent = os.environ['GITHUB_SHA']
          paths = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'pr72-targets.json').read_text(encoding='utf-8'))
          tree = api('/git/trees', {'base_tree':api('/git/commits/' + parent)['tree']['sha'],'tree':[{'path':p,'mode':'100644','type':'blob','content':pathlib.Path(p).read_text(encoding='utf-8')} for p in paths] + [{'path':'.github/workflows/pr72-native-tests.yml','mode':'100644','type':'blob','sha':None}]})['sha']
          commit = api('/git/commits', {'message':'test: validate exact native payload names across current cache and runtime scenarios','tree':tree,'parents':[parent]})['sha']
          output = pathlib.Path('NativeTestValidation'); output.mkdir(exist_ok=True)
          (output / 'commit.json').write_text(json.dumps({'parent':parent,'commit':commit,'tree':tree,'files':paths},indent=2),encoding='utf-8')
          print('PREPARED_NATIVE_TEST_COMMIT=' + commit)
      - name: Install dependencies for Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Full suite Windows PowerShell 5.1
        continue-on-error: true
        id: winps
        shell: powershell
        run: ./build/Test-Module.ps1 -ResultsPath TestResults/WindowsPowerShell51
      - name: Install dependencies for PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Full suite PowerShell 7
        continue-on-error: true
        id: pwsh
        shell: pwsh
        run: ./build/Test-Module.ps1 -ResultsPath TestResults/PowerShell7
      - name: Aggregate full-suite outcomes
        if: always()
        shell: pwsh
        env:
          PS51_OUTCOME: ${{ steps.winps.outcome }}
          PS7_OUTCOME: ${{ steps.pwsh.outcome }}
        run: |
          New-Item -ItemType Directory NativeTestValidation -Force | Out-Null
          @{ WindowsPowerShell51=$env:PS51_OUTCOME; PowerShell7=$env:PS7_OUTCOME } | ConvertTo-Json | Set-Content NativeTestValidation/outcomes.json -Encoding UTF8
          if ($env:PS51_OUTCOME -ne 'success' -or $env:PS7_OUTCOME -ne 'success') { throw 'Both full suites must pass; failures have not been ignored.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr72-native-test-validation
          path: |
            NativeTestValidation/
            TestResults/
          retention-days: 7
