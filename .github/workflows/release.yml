name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Expected release version, for example 0.29.1. Leave empty to use ModuleVersion.'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  version-change:
    runs-on: windows-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check whether the module version increased
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              'publish=true' >> $env:GITHUB_OUTPUT
              exit 0
          }
          if ($env:BEFORE_SHA -notmatch '^[0-9a-f]{40}$' -or $env:BEFORE_SHA -match '^0+$') {
              throw 'Cannot establish the previous main version. Use a reviewed manual release.'
          }
          $previousText = git show "$($env:BEFORE_SHA):OSDStage.psd1"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the previous module manifest.' }
          $match = [regex]::Match(($previousText -join "`n"), '(?m)^\s*ModuleVersion\s*=\s*[''"](?<version>\d+\.\d+\.\d+(?:\.\d+)?)[''"]')
          if (-not $match.Success) { throw 'Cannot read the previous module version.' }
          $previous = [version]$match.Groups['version'].Value
          $current = [version](Import-PowerShellDataFile ./OSDStage.psd1).ModuleVersion
          if ($current -lt $previous) { throw 'The module version must not decrease.' }
          $publish = $current -gt $previous
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Module version: $previous -> $current. Publish: $publish."

  release:
    needs: version-change
    if: needs.version-change.outputs.publish == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:SOURCE_REF -ne 'main') {
              throw "GitHub releases must be created from the main branch. Current ref: '$env:SOURCE_REF'."
          }

          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:SOURCE_SHA) {
              throw "Release source '$env:SOURCE_SHA' is not the current origin/main commit '$remoteMain'."
          }

          Write-Host "Release source matches origin/main: $env:SOURCE_SHA"

      - name: Resolve and validate version
        id: release
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $manifest = Test-ModuleManifest ./OSDStage.psd1 -ErrorAction Stop
          $moduleVersion = $manifest.Version.ToString()
          $expectedVersion = [string]$env:EXPECTED_VERSION

          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
              $expectedVersion = $moduleVersion
          }

          $expectedVersion = $expectedVersion.Trim() -replace '^v',''

          if ($expectedVersion -ne $moduleVersion) {
              throw "Expected version '$expectedVersion' does not match ModuleVersion '$moduleVersion'."
          }

          $tag = "v$expectedVersion"

          "release_version=$expectedVersion" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          Write-Host "Resolved release: $tag"

      - name: Check existing tag and release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch --tags --force
          $tagExists = -not [string]::IsNullOrWhiteSpace((git tag --list $env:TAG))
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($tagExists) {
              $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
              if ($tagCommit -ne $env:GITHUB_SHA) {
                  throw "Tag '$env:TAG' already exists at commit '$tagCommit' instead of current release commit '$env:GITHUB_SHA'."
              }

              Write-Host "Tag '$env:TAG' already exists at the expected commit."
          }
          else {
              Write-Host "Tag '$env:TAG' does not exist yet."
          }

          $releaseExists = $false
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExitCode = $LASTEXITCODE

          if ($releaseExitCode -eq 0) {
              $releaseExists = $true
              Write-Host "GitHub release '$env:TAG' already exists. Treating this workflow run as an idempotent success."
          }
          else {
              Write-Host "GitHub release '$env:TAG' does not exist yet."
          }

          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          # A missing release is the expected state before creating a new release.
          exit 0

      - name: Install validation dependencies
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate release candidate
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          ./build/Test-Module.ps1

      - name: Create GitHub release
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Use the version-specific CHANGELOG content as GitHub Release notes.
          # Automatic PR titles alone do not explain deployment fixes.
          $changelog = Get-Content -LiteralPath './CHANGELOG.md' -Raw -Encoding UTF8
          $pattern = '(?ms)^##[ ]+' + [regex]::Escape($env:RELEASE_VERSION) + '[ ]*\r?\n(?<notes>.*?)(?=^##[ ]+|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
              throw "CHANGELOG.md is missing notes for version $env:RELEASE_VERSION."
          }
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = $match.Groups['notes'].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
              throw "Release notes for version $env:RELEASE_VERSION are empty."
          }
          [System.IO.File]::WriteAllText(
              $releaseNotesPath,
              ("# OSDStage v$($env:RELEASE_VERSION)" + [Environment]::NewLine + [Environment]::NewLine + $notes + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )

          $arguments = @(
              'release', 'create', $env:TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "OSDStage v$env:RELEASE_VERSION",
              '--notes-file', $releaseNotesPath
          )

          if ($env:TAG_EXISTS -eq 'true') {
              $arguments += '--verify-tag'
          }
          else {
              $arguments += @('--target', $env:GITHUB_SHA)
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Created GitHub release $env:TAG."

      - name: Start verified PowerShell Gallery publication
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # workflow_dispatch events triggered with GITHUB_TOKEN can start another workflow.
          # This happens only after the tag/release and validation succeeded.
          gh workflow run publish.yml --repo $env:GITHUB_REPOSITORY --ref main -f "expected_version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not dispatch PSGallery publication for OSDStage $env:RELEASE_VERSION."
          }
          Write-Host "Dispatched PSGallery publication for OSDStage $env:RELEASE_VERSION."
