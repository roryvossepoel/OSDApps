name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Exact release version, for example 1.0.0-rc1. Leave empty to use the manifest.'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:SOURCE_REF -ne 'main') {
              throw "GitHub releases must be created from the main branch. Current ref: '$env:SOURCE_REF'."
          }

          $remoteMain = (git rev-parse origin/main).Trim()
          if ($remoteMain -ne $env:SOURCE_SHA) {
              throw "Release source '$env:SOURCE_SHA' is not the current origin/main commit '$remoteMain'."
          }

          Write-Host "Release source matches origin/main: $env:SOURCE_SHA"

      - name: Resolve and validate version
        id: release
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          Test-ModuleManifest ./OSDStage.psd1 -ErrorAction Stop | Out-Null
          $release = ./build/Get-ReleaseVersion.ps1 -ExpectedVersion $env:EXPECTED_VERSION
          "release_version=$($release.Version)" >> $env:GITHUB_OUTPUT
          "tag=$($release.Tag)" >> $env:GITHUB_OUTPUT
          "prerelease=$($release.IsPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved release: $($release.Tag)"


      - name: Check existing tag and release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'

          git fetch --tags --force
          $tagExists = -not [string]::IsNullOrWhiteSpace((git tag --list $env:TAG))
          "tag_exists=$($tagExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          if ($tagExists) {
              $tagCommit = (git rev-list -n 1 $env:TAG).Trim()
              if ($tagCommit -ne $env:GITHUB_SHA) {
                  throw "Tag '$env:TAG' already exists at commit '$tagCommit' instead of current release commit '$env:GITHUB_SHA'."
              }

              Write-Host "Tag '$env:TAG' already exists at the expected commit."
          }
          else {
              Write-Host "Tag '$env:TAG' does not exist yet."
          }

          $releaseExists = $false
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExitCode = $LASTEXITCODE

          if ($releaseExitCode -eq 0) {
              $releaseExists = $true
              Write-Host "GitHub release '$env:TAG' already exists. Treating this workflow run as an idempotent success."
          }
          else {
              Write-Host "GitHub release '$env:TAG' does not exist yet."
          }

          "release_exists=$($releaseExists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

          # A missing release is the expected state before creating a new release.
          exit 0

      - name: Install validation dependencies
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate release candidate
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          ./build/Test-Module.ps1

      - name: Create GitHub release
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Use the version-specific CHANGELOG content as GitHub Release notes.
          # Automatic PR titles alone do not explain deployment fixes.
          $changelog = Get-Content -LiteralPath './CHANGELOG.md' -Raw -Encoding UTF8
          $pattern = '(?ms)^##[ ]+' + [regex]::Escape($env:RELEASE_VERSION) + '[ ]*\r?\n(?<notes>.*?)(?=^##[ ]+|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
              throw "CHANGELOG.md is missing notes for version $env:RELEASE_VERSION."
          }
          $releaseNotesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = $match.Groups['notes'].Value.Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) {
              throw "Release notes for version $env:RELEASE_VERSION are empty."
          }
          [System.IO.File]::WriteAllText(
              $releaseNotesPath,
              ("# OSDStage v$($env:RELEASE_VERSION)" + [Environment]::NewLine + [Environment]::NewLine + $notes + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
          )

          $arguments = @(
              'release', 'create', $env:TAG,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "OSDStage v$env:RELEASE_VERSION",
              '--notes-file', $releaseNotesPath
          )

          if ($env:IS_PRERELEASE -eq 'true') { $arguments += @('--prerelease', '--latest=false') }

          if ($env:TAG_EXISTS -eq 'true') {
              $arguments += '--verify-tag'
          }
          else {
              $arguments += @('--target', $env:GITHUB_SHA)
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub release creation failed with exit code $LASTEXITCODE."
          }

          Write-Host "Created GitHub release $env:TAG."

      - name: Start verified PowerShell Gallery publication
        if: steps.existing.outputs.release_exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # workflow_dispatch events triggered with GITHUB_TOKEN can start another workflow.
          # This happens only after the tag/release and validation succeeded.
          gh workflow run publish.yml --repo $env:GITHUB_REPOSITORY --ref main -f "expected_version=$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) {
              throw "Could not dispatch PSGallery publication for OSDStage $env:RELEASE_VERSION."
          }
          Write-Host "Dispatched PSGallery publication for OSDStage $env:RELEASE_VERSION."
