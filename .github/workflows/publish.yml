name: Publish PowerShell Gallery

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: 'Exact Gallery version to publish, for example 0.29.1. The matching v<version> Git tag must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: powershell-gallery-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.expected_version }}
          fetch-depth: 0

      - name: Verify release tag
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = $env:EXPECTED_VERSION.Trim() -replace '^v',''
          $expectedTag = "v$expectedVersion"
          $exactTag = (git describe --tags --exact-match HEAD 2>$null).Trim()

          if ($LASTEXITCODE -ne 0 -or $exactTag -ne $expectedTag) {
              throw "PSGallery publication must run from immutable tag '$expectedTag'. Checked out HEAD is not that exact tag."
          }

          Write-Host "Publishing source is pinned to tag $exactTag at commit $env:GITHUB_SHA."

      - name: Install validation dependencies
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Validate tagged source
        shell: pwsh
        run: |
          ./build/Test-Module.ps1

      - name: Build Gallery package
        shell: pwsh
        run: |
          ./build/Build-Module.ps1 -OutputPath ./dist | Format-List

      - name: Validate Gallery package version
        id: release
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $expectedVersion = $env:EXPECTED_VERSION.Trim() -replace '^v',''
          $manifestPath = Join-Path $PWD 'dist\OSDApps\OSDApps.psd1'
          $manifest = Test-ModuleManifest -Path $manifestPath -ErrorAction Stop
          $galleryVersion = $manifest.Version.ToString()

          if ($expectedVersion -ne $galleryVersion) {
              throw "Expected version '$expectedVersion' does not match built module version '$galleryVersion'."
          }

          "gallery_version=$galleryVersion" >> $env:GITHUB_OUTPUT
          Write-Host "Release package validation passed for OSDApps $galleryVersion."

      - name: Publish and verify PowerShell Gallery package
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          GALLERY_VERSION: ${{ steps.release.outputs.gallery_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GALLERY_VERSION
          $modulePath = Join-Path $PWD 'dist\OSDApps'

          function Find-PublishedVersion {
              try {
                  Find-Module -Name OSDApps -RequiredVersion $version -Repository PSGallery -ErrorAction Stop
              }
              catch {
                  if ($_.Exception.Message -match 'No match was found|Unable to find module|No match found') { return $null }
                  throw "Unable to query PSGallery: $($_.Exception.Message)"
              }
          }

          function Test-PublishedContent {
              param(
                  [ValidateRange(1,60)][int]$MaximumAttempts = 12,
                  [ValidateRange(1,60)][int]$RetryDelaySeconds = 10
              )

              $downloadPath = Join-Path $env:RUNNER_TEMP 'gallery-verify'
              $downloaded = $false
              $lastDownloadError = $null
              for ($attempt = 1; $attempt -le $MaximumAttempts; $attempt++) {
                  # Each attempt starts clean; partial downloads cannot satisfy verification.
                  if (Test-Path -LiteralPath $downloadPath) {
                      Remove-Item -LiteralPath $downloadPath -Recurse -Force -ErrorAction Stop
                  }
                  New-Item -ItemType Directory -Path $downloadPath -Force -ErrorAction Stop | Out-Null
                  try {
                      Save-Module -Name OSDApps -RequiredVersion $version -Repository PSGallery -Path $downloadPath -Force -ErrorAction Stop
                      $downloaded = $true
                      break
                  }
                  catch {
                      $lastDownloadError = $_.Exception.Message
                      Write-Warning "Gallery verification download attempt $attempt/$MaximumAttempts failed: $lastDownloadError"
                  }
                  if ($attempt -lt $MaximumAttempts) { Start-Sleep -Seconds $RetryDelaySeconds }
              }
              if (-not $downloaded) {
                  throw "Unable to download OSDApps $version for verification after $MaximumAttempts attempts. Publication is not verified. Last download error: $lastDownloadError"
              }

              # Retrieval can be delayed after a successful push. Content mismatches
              # are not retrieval failures and must fail immediately without a retry.
              $publishedPath = Join-Path $downloadPath "OSDApps\$version"
              if (-not (Test-Path -LiteralPath $publishedPath -PathType Container)) {
                  throw "Published OSDApps $version was not downloaded for verification."
              }

              $localFiles = @(Get-ChildItem -LiteralPath $modulePath -Recurse -File)
              if ($localFiles.Count -eq 0) { throw "Release package contains no files: $modulePath" }
              foreach ($file in $localFiles) {
                  $relative = $file.FullName.Substring($modulePath.Length).TrimStart('\','/')
                  $publishedFile = Join-Path $publishedPath $relative
                  if (-not (Test-Path -LiteralPath $publishedFile -PathType Leaf)) {
                      throw "Published package is missing file: $relative"
                  }
                  $localHash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
                  $publishedHash = (Get-FileHash -LiteralPath $publishedFile -Algorithm SHA256).Hash
                  if ($localHash -ne $publishedHash) {
                      throw "Published package does not match the release: $relative"
                  }
              }
              Write-Host "Verified $($localFiles.Count) release files against PSGallery version $version."
          }

          # A pre-existing version must not masquerade as a successful new publication.
          if (Find-PublishedVersion) {
              throw "OSDApps $version already exists before publication. PSGallery versions are immutable; do not retry publishing this version."
          }
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
              throw 'PSGALLERY_API_KEY is not available.'
          }

          $publishError = $null
          try {
              Publish-Module -Path $modulePath -Repository PSGallery -NuGetApiKey $env:PSGALLERY_API_KEY -Force -ErrorAction Stop
          }
          catch {
              $publishError = $_
              Write-Warning "Publish-Module returned an error: $($_.Exception.Message)"
              # Only reconcile a duplicate-version response. Other errors remain failures.
              if ($_.Exception.Message -notmatch '409|already exists and cannot be modified') { throw }
          }

          # Save-Module is the readiness check: discovery alone can succeed before
          # the exact package is downloadable. Retry retrieval, never the push.
          # A 409 can occur after a successful push. Never treat it as success
          # unless the Gallery package matches our built, immutable release.
          Test-PublishedContent
          if ($publishError) {
              Write-Host "The push returned 409, but PSGallery contains the exact verified release. Publication succeeded."
          }
          else {
              Write-Host "OSDApps $version published and verified successfully."
          }
